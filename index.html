<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Московский Транспорт</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="main-header">
            <div class="container">
                <div class="logo-area">
                    <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <path d="M50 10 C28 10 10 28 10 50 C10 72 28 90 50 90 C72 90 90 72 90 50" fill="none" stroke="#D9232E" stroke-width="8" />
                        <path d="M50 25 C36 25 25 36 25 50 C25 64 36 75 50 75" fill="none" stroke="#D9232E" stroke-width="8" />
                        <circle cx="50" cy="50" r="8" fill="#D9232E" />
                    </svg>
                    <div class="brand-name">
                        <a href="index.html">Московский<br>Транспорт</a>
                        <span class="brand-subtitle">Единый транспортный портал</span>
                    </div>
                </div>

                <input type="checkbox" id="menu-toggle" class="menu-checkbox">
                <label for="menu-toggle" class="burger-btn">
                    <span></span><span></span><span></span>
                </label>

                <nav class="side-menu">
                    <div class="side-menu-header">
                        <label for="menu-toggle" class="close-btn">&times;</label>
                        <h4>Меню портала</h4>
                    </div>
                    <ul>
                        <li><a id="nav-main" class="nav-link active">Главная</a></li>
                        <li><a id="nav-calc" class="nav-link">Сервисы</a></li>
                        <li><a id="nav-author" class="nav-link">О проекте</a></li>
                    </ul>
                </nav>
                <label for="menu-toggle" class="menu-overlay"></label>
            </div>
        </div>
    </header>

    <div id="root"></div>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script src="main.js" type="module"></script>
</body>
</html>
